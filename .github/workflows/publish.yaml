name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.repository == 'j842/pi-discrimen'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check release tag and repository
        id: release
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version, repository } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/, 'Use a release version without build metadata');
          assert.equal(process.env.RELEASE_REF, `refs/tags/v${version}`, 'Tag must match package.json version');
          assert.equal(repository?.url, 'git+https://github.com/j842/pi-discrimen.git', 'npm provenance requires the publishing repository');
          const channel = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\n`);
          console.log(`Release ${version} will publish to ${channel}`);
          NODE

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.20.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and test
        run: npm run verify

      - name: Pack and test the release archive
        id: package
        run: |
          package_dir=$(mktemp -d)
          npm pack --json --pack-destination "$package_dir" > "$package_dir/metadata.json"
          package_file=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename)' "$package_dir/metadata.json")
          tar -xzf "$package_dir/$package_file" -C "$package_dir"
          PI_DISCRIMEN_PACKAGE_UNDER_TEST="$package_dir/package" \
            node --experimental-strip-types --test test/pi.test.ts
          echo "tarball=$package_dir/$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish tested archive using OIDC
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_DIST_TAG: ${{ steps.release.outputs.channel }}
        run: |
          # npm authenticates through GitHub OIDC and adds provenance automatically.
          npm publish "$PACKAGE_TARBALL" --access public --tag "$NPM_DIST_TAG" \
            --registry https://registry.npmjs.org --ignore-scripts

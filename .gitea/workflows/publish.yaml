name: Test and publish to npm

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Node 20 action runtimes work with the existing forge.jde.nz runners.
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check release tag
        id: release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/, 'Use a release version without build metadata');
          assert.equal(process.env.RELEASE_REF, `refs/tags/v${version}`, 'Tag must match package.json version');
          const channel = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\n`);
          console.log(`Release ${version} will publish to ${channel}`);
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and test
        run: npm run verify

      - name: Pack and test the release archive
        id: package
        run: |
          package_dir=$(mktemp -d)
          npm pack --json --pack-destination "$package_dir" > "$package_dir/metadata.json"
          package_file=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename)' "$package_dir/metadata.json")
          tar -xzf "$package_dir/$package_file" -C "$package_dir"
          PI_DISCRIMIN_PACKAGE_UNDER_TEST="$package_dir/package" \
            node --experimental-strip-types --test test/pi.test.ts
          echo "tarball=$package_dir/$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish tested archive to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'public/pi-discrimin'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_DIST_TAG: ${{ steps.release.outputs.channel }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Add the NPM_TOKEN repository Actions secret before releasing.' >&2
            exit 1
          fi
          # The source and this exact archive have already passed verification.
          npm publish "$PACKAGE_TARBALL" --access public --tag "$NPM_DIST_TAG" \
            --registry https://registry.npmjs.org --ignore-scripts
